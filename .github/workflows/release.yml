# This GitHub Action automates the process of building Grafana plugins.
# (For more information, see https://github.com/grafana/plugin-actions/blob/main/build-plugin/README.md)
name: Release

on:
  push:
    tags:
      - 'v*' # Run workflow on version tags, e.g. v1.0.0.

permissions: read-all

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: grafana/plugin-actions/build-plugin@build-plugin/v1.2.0
        with:
          # Community signature once the plugin is approved for the catalog and the repository
          # variable SIGN_PLUGIN is true; until then the archive stays unsigned (first submission).
          policy_token: ${{ vars.SIGN_PLUGIN == 'true' && secrets.GRAFANA_ACCESS_POLICY_TOKEN || '' }}
          attestation: true
          # The action defaults to Go 1.25 / Node 20; go.mod needs Go >= 1.26.5, CI uses Node 22.
          go-version: '1.26'
          node-version: '22'
